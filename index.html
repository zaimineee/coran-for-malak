,back:{name:"quiz"}})})}const APP_V="Coran for Malak \xB7 "+(SITE?"version 1.10":"aper\xE7u 1.10")+" \xB7 13 novembre 2026",DOC_DATE="12 novembre 2026",CONTACT_URL="https://github.com/zaimineee/coran-for-malak/issues",SOURCE_URL="https://github.com/zaimineee/coran-for-malak",DOCS={privacy:["Confidentialit\xE9",[["En bref","L\u2019app sert \xE0 lire et apprendre le Coran. Elle n\u2019a ni publicit\xE9, ni pistage, ni cookies, et elle ne vend rien."+(SITE?" Sans identifiant, ta progression reste sur ton t\xE9l\xE9phone. Avec un identifiant, une copie est gard\xE9e en ligne pour toi, et tes amis ne voient que quelques chiffres.":" Ta progression reste sur cet appareil.")],["Qui est responsable","Coran for Malak est une app gratuite faite par un particulier au Qu\xE9bec, sans entreprise et sans revenus. La personne responsable de la protection des renseignements personnels est le cr\xE9ateur de l\u2019app. Pour la joindre : voir \xAB Contact \xBB dans Compte \u2192 \xC0 propos."],["Ce que l\u2019app enregistre","Ton pr\xE9nom, ta photo si tu en ajoutes une, ton compagnon et tes r\xE9glages, ta lecture (ayat lues, hasanat, temps, s\xE9rie), ton hifz (ayat ma\xEEtris\xE9es, en cours, r\xE9visions), tes favoris, tes r\xE9sultats de quiz, et la ville ou la position choisie pour les heures de pri\xE8re."+(SITE?" Avec un identifiant : cet identifiant, la date de ton accord, la liste des amis que tu as ajout\xE9s, les encouragements envoy\xE9s ou re\xE7us entre amis (qui, quand ; effac\xE9s apr\xE8s 30 jours) et, si tu actives les notifications des pri\xE8res, les moments de tes prochaines alertes.":"")],["Ce qu\u2019elle n\u2019enregistre pas","Pas d\u2019adresse e-mail, pas de num\xE9ro de t\xE9l\xE9phone, pas de nom de famille, pas de date de naissance, pas de contacts du t\xE9l\xE9phone, pas de donn\xE9es de navigation. On ne demande que ce qui sert \xE0 une fonction de l\u2019app."],["Pourquoi","Seulement pour faire marcher l\u2019app : te montrer ta progression, tes r\xE9visions et tes statistiques"+(SITE?", la retrouver sur un autre t\xE9l\xE9phone, et montrer ta s\xE9rie aux amis que tu as choisis":"")+". Jamais pour de la publicit\xE9, du profilage ou de la revente."],["Ta position","Elle n\u2019est demand\xE9e que si tu touches \xAB Ma position \xBB, et ton t\xE9l\xE9phone te demande ton accord. Elle sert seulement \xE0 calculer les heures de pri\xE8re et la direction de la Qibla, sur ton t\xE9l\xE9phone. Elle est arrondie \xE0 environ 1 km, gard\xE9e sur cet appareil, jamais envoy\xE9e (m\xEAme avec un identifiant), et elle n\u2019est pas dans le code de sauvegarde. Si tu actives les notifications des pri\xE8res, seuls les moments des alertes sont envoy\xE9s, jamais ta position ; ces heures permettent toutefois de deviner \xE0 peu pr\xE8s ta r\xE9gion. La boussole utilise les capteurs du t\xE9l\xE9phone seulement quand tu l\u2019actives."],["O\xF9 c\u2019est gard\xE9",SITE?"Sur cet appareil, dans le stockage de ton navigateur ou de l\u2019app. Si tu cr\xE9es un identifiant, une copie de ta progression et de tes r\xE9glages (sans ta photo ni ta position) est aussi gard\xE9e en ligne chez Supabase, un service d\u2019h\xE9bergement de bases de donn\xE9es. Ses serveurs peuvent \xEAtre situ\xE9s hors du Qu\xE9bec. Les r\xE8gles d\u2019acc\xE8s de la base emp\xEAchent toute autre personne de lire ta progression.":"Uniquement sur cet appareil, dans le stockage de ton navigateur ou de l\u2019app. Rien n\u2019est envoy\xE9 sur un serveur."],["Qui peut le voir","Sur ce t\xE9l\xE9phone : les personnes qui l\u2019utilisent, car les comptes de l\u2019appareil ne sont pas prot\xE9g\xE9s par un mot de passe. Ne mets donc rien de priv\xE9 dans un nom de dossier."+(SITE?" En ligne : toi seul\xB7e, avec ton identifiant et ton mot de passe. Tes amis voient seulement ton pr\xE9nom, ton identifiant, ton compagnon, ta s\xE9rie, tes ayat et hasanat du jour et de la semaine et ton total d\u2019ayat, et seulement si tu les as ajout\xE9s toi-m\xEAme. Une personne connect\xE9e peut savoir si un identifiant existe, sans rien voir d\u2019autre.":"")],...SITE?[["Identifiant et mot de passe","Ton identifiant sert d\u2019adresse technique (identifiant@zaimineee.github.io) : aucune adresse e-mail n\u2019est demand\xE9e et aucun e-mail n\u2019est envoy\xE9. Le mot de passe est prot\xE9g\xE9 par Supabase (il n\u2019est gard\xE9 que sous une forme illisible, dite \xAB hach\xE9e \xBB) et l\u2019app ne le garde pas : sur le t\xE9l\xE9phone, seule une cl\xE9 de session est gard\xE9e. Un mot de passe oubli\xE9 ne peut pas \xEAtre r\xE9cup\xE9r\xE9."]]:[],...SITE?[["Notifications","Seulement si tu les actives (dans \xAB Mes amis \xBB), et ton t\xE9l\xE9phone te demande ton accord. Ton t\xE9l\xE9phone donne alors une adresse d\u2019abonnement (chez Apple ou Google), gard\xE9e en ligne avec ton compte pour t\u2019envoyer les encouragements de tes amis. Le contenu de la notification est chiffr\xE9 : Apple ou Google ne peuvent pas le lire. Tu peux les d\xE9sactiver dans l\u2019app ou dans les r\xE9glages du t\xE9l\xE9phone ; te d\xE9connecter ou supprimer ton compte en ligne les supprime aussi."],["Notifications des pri\xE8res","Seulement si tu les actives (dans \xAB Pri\xE8res \xBB). Ton t\xE9l\xE9phone calcule les heures et envoie seulement les moments des alertes des 30 prochains jours (date, heure, nom de la pri\xE8re, minutes d\u2019avance), gard\xE9s en ligne avec ton compte pour que le serveur t\u2019envoie la notification \xE0 l\u2019heure. Chaque alerte est effac\xE9e un jour apr\xE8s ; toutes le sont tout de suite si tu les d\xE9sactives, te d\xE9connectes ou supprimes ton compte en ligne."]]:[],["Cookies et stockage","L\u2019app n\u2019utilise aucun cookie, ni publicitaire, ni de mesure d\u2019audience. Elle garde tes donn\xE9es dans le stockage local de ton navigateur ou de l\u2019app, et une copie des fichiers du Coran pour fonctionner sans internet. C\u2019est n\xE9cessaire au fonctionnement de l\u2019app : il n\u2019y a donc pas de bandeau de cookies \xE0 accepter."],["Code de sauvegarde","Le code contient ta progression et tes r\xE9glages (pas ta photo ni ta position). Il ne part nulle part tout seul : c\u2019est toi qui le copies. Garde-le pour toi, car la personne qui l\u2019a peut restaurer ta progression sur son t\xE9l\xE9phone."],["Services ext\xE9rieurs","L\u2019app n\u2019int\xE8gre aucun outil de suivi ni de publicit\xE9. "+(SITE?"Les polices de calligraphie sont incluses dans l\u2019app.":"Dans cet aper\xE7u, les calligraphies Amiri et Scheherazade viennent de Google Fonts, qui voit ton adresse IP ; sur le site de l\u2019app, elles sont incluses dans l\u2019app.")+(SITE?" Certaines fonctions t\xE9l\xE9chargent des fichiers publics, sans y joindre tes donn\xE9es : les r\xE9citations d\u2019everyayah.com (ou de son miroir Maqra sur Hugging Face) et le minutage des mots (Hugging Face) quand tu \xE9coutes, les traductions et leurs notes de quran.com, et les tafsirs de la Tafsir API (h\xE9berg\xE9e sur GitHub) quand tu les ouvres. Ces services, comme l\u2019h\xE9bergeur du site (GitHub Pages), voient ton adresse IP, comme pour n\u2019importe quel site, mais jamais ta progression. Seul Supabase re\xE7oit ta progression, et seulement si tu utilises un identifiant. Les notifications passent par le service de ton t\xE9l\xE9phone (Apple ou Google), chiffr\xE9es.":"")],["Combien de temps","Sur le t\xE9l\xE9phone : jusqu\u2019\xE0 ce que tu supprimes le compte, que tu effaces les donn\xE9es ou que tu retires l\u2019app."+(SITE?" En ligne : tant que ton compte en ligne existe. Quand tu le supprimes, tout ce qui est en ligne est effac\xE9 tout de suite.":"")],["Tes droits","Tu peux consulter tes donn\xE9es (tout est visible dans l\u2019app), les corriger, les emporter (code de sauvegarde), retirer ton accord et les faire supprimer. "+(SITE?"Pour ce qui est en ligne : Compte \u2192 \xAB Supprimer mon compte en ligne \xBB. ":"")+"Si tu ne peux pas le faire dans l\u2019app (par exemple mot de passe oubli\xE9), \xE9cris via \xAB Contact \xBB : on te demandera de prouver que le compte est \xE0 toi, puis on l\u2019efface. Tu peux aussi porter plainte \xE0 la Commission d\u2019acc\xE8s \xE0 l\u2019information du Qu\xE9bec."],["Effacer tes donn\xE9es","Compte \u2192 Modifier \u2192 \xAB Supprimer ce compte de ce t\xE9l\xE9phone \xBB, ou \xAB Effacer toutes les donn\xE9es de cet appareil \xBB dans \xC0 propos. Effacer les donn\xE9es du navigateur supprime aussi tout ce qui est sur le t\xE9l\xE9phone."+(SITE?" Pour ce qui est en ligne : Compte \u2192 \xAB Supprimer mon compte en ligne \xBB efface tout de suite ta progression en ligne, ta s\xE9rie partag\xE9e et tes liens d\u2019amis.":"")],["Enfants",SITE?"Sans identifiant, l\u2019app ne collecte rien \xE0 distance. Un identifiant en ligne demande d\u2019avoir 14 ans ou plus ; avant 14 ans, c\u2019est un parent qui donne son accord, cr\xE9e l\u2019identifiant (sans nom de famille) et garde le mot de passe.":"L\u2019app ne collecte rien \xE0 distance. Un parent peut cr\xE9er le compte de son enfant sur son appareil."],["E-mails","L\u2019app n\u2019envoie aucun e-mail ni aucune infolettre : il n\u2019y a donc rien \xE0 quoi se d\xE9sabonner."+(SITE?" Les seules notifications sont les encouragements de tes amis et les alertes de pri\xE8re, si tu les as activ\xE9s.":"")],["Incident","Si un incident touchait des renseignements personnels avec un risque de pr\xE9judice s\xE9rieux, les personnes concern\xE9es et la Commission d\u2019acc\xE8s \xE0 l\u2019information du Qu\xE9bec seraient avis\xE9es."],["Changements","Si une nouvelle fonction en ligne est ajout\xE9e, cette page sera mise \xE0 jour avant. Derni\xE8re mise \xE0 jour : "+DOC_DATE+"."]]],terms:["Conditions d\u2019utilisation",[["Usage","App gratuite, pour un usage personnel et non commercial. Elle est fournie telle quelle, sans garantie."],["Prix","L\u2019app est gratuite : pas d\u2019achat, pas d\u2019abonnement, pas de frais cach\xE9s, pas de publicit\xE9. Voir aussi \xAB Remboursement \xBB."],["Le texte du Coran","Il vient du Complexe du Roi Fahd pour l\u2019impression du Noble Coran (M\xE9dine) et il est affich\xE9 sans modification. Si tu vois une erreur d\u2019affichage, signale-la via \xAB Contact \xBB."],["Traductions et tafsirs","Ce sont les \u0153uvres de leurs auteurs (voir Sources). Une traduction n\u2019est pas le Coran : c\u2019est une explication de son sens. L\u2019app ne g\xE9n\xE8re aucune traduction ni aucun tafsir."],["Heures de pri\xE8re et Qibla","Elles sont calcul\xE9es \xE0 partir de la position du Soleil et de ta ville, avec la m\xE9thode choisie. Elles peuvent diff\xE9rer de quelques minutes de celles de ta mosqu\xE9e, et la boussole d\u2019un t\xE9l\xE9phone peut \xEAtre fauss\xE9e par le m\xE9tal ou les aimants. En cas de doute, suis ta mosqu\xE9e."],["Hasanat","Le nombre affich\xE9 est une estimation : 10 hasanat par lettre, d\u2019apr\xE8s le hadith rapport\xE9 par at-Tirmidh\xEE (n\xB0 2910). Allah seul conna\xEEt la r\xE9compense."],["Tajwid, quiz et r\xE9visions","Ce sont des aides calcul\xE9es automatiquement. Elles peuvent contenir des erreurs et ne remplacent pas l\u2019apprentissage avec un enseignant."],["Avis","L\u2019app n\u2019affiche ni avis, ni t\xE9moignages, ni notes d\u2019utilisateurs."],...SITE?[["Compte en ligne","Gratuit et facultatif, \xE0 partir de 14 ans (avant, avec l\u2019accord d\u2019un parent). Tu es responsable de ton mot de passe. Choisis un identifiant correct, sans nom de famille ni information priv\xE9e : tes amis le voient. Un identifiant insultant ou trompeur peut \xEAtre supprim\xE9. Le service en ligne peut \xEAtre indisponible un moment ou s\u2019arr\xEAter : ta progression reste aussi sur ton t\xE9l\xE9phone, et le code de sauvegarde reste utile."]]:[],["Respect des contenus","Ne reprends pas les textes de l\u2019app pour les modifier ou les vendre. Les contenus des sources gardent leurs propres licences."],["Droit applicable","Ces condition
