es de l\u2019app, pour que tu la retrouves sur un autre t\xE9l\xE9phone. Sans identifiant, rien n\u2019est envoy\xE9 sur un serveur. Il n\u2019y a ni publicit\xE9, ni pistage, ni vente de donn\xE9es.":"Uniquement sur cet appareil, dans le stockage de ton navigateur ou de l\u2019app. Rien n\u2019est envoy\xE9 sur un serveur. Il n\u2019y a ni publicit\xE9, ni pistage, ni vente de donn\xE9es."],["Qui peut le voir","Sur ce t\xE9l\xE9phone : les personnes qui l\u2019utilisent, car les comptes de l\u2019appareil ne sont pas prot\xE9g\xE9s par un mot de passe. Ne mets donc rien de priv\xE9 dans un nom de dossier."+(SITE?" En ligne : toi seul\xB7e, avec ton identifiant et ton mot de passe. Tes amis voient seulement ton pr\xE9nom, ton identifiant, ton compagnon, ta s\xE9rie, tes ayat et hasanat du jour et de la semaine et ton total d\u2019ayat, et seulement si tu les as ajout\xE9s toi-m\xEAme. Une personne connect\xE9e peut savoir si un identifiant existe, sans rien voir d\u2019autre.":"")],...SITE?[["Identifiant et mot de passe","Ton identifiant sert d\u2019adresse technique (identifiant@zaimineee.github.io) : aucune adresse e-mail n\u2019est demand\xE9e et aucun e-mail n\u2019est envoy\xE9. Le mot de passe est prot\xE9g\xE9 par Supabase (il n\u2019est gard\xE9 que sous une forme illisible, dite \xAB hach\xE9e \xBB) et l\u2019app ne le garde pas : sur le t\xE9l\xE9phone, seule une cl\xE9 de session est gard\xE9e. Un mot de passe oubli\xE9 ne peut pas \xEAtre r\xE9cup\xE9r\xE9."]]:[],["Code de sauvegarde","Le code contient ta progression et tes r\xE9glages (pas ta photo). Il ne part nulle part tout seul : c\u2019est toi qui le copies. Garde-le pour toi, car la personne qui l\u2019a peut restaurer ta progression sur son t\xE9l\xE9phone."],["Services ext\xE9rieurs","Pour certaines fonctions, l\u2019app t\xE9l\xE9charge des fichiers publics, sans y joindre tes donn\xE9es : les polices Google Fonts (calligraphies Amiri et Scheherazade, tafsir en arabe)"+(SITE?", les r\xE9citatio
